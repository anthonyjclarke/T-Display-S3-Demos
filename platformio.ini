; LilyGO T-Display S3 — capability demos
; ESP32-S3R8 · 16MB flash · 8MB OPI PSRAM · ST7789 170x320 on 8-bit parallel bus

[env:t-display-s3]
; Pinned to 6.9.0 (Arduino core 2.0.17) — TFT_eSPI's S3 parallel driver is not
; reliable on core 3.x
platform      = espressif32@6.9.0
board         = lilygo-t-display-s3
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
; Board JSON already sets qio_opi memory, default_16MB.csv and USB CDC on boot
board_build.partitions = default_16MB.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DBOARD_HAS_PSRAM
    ; --- TFT_eSPI config (mirrors Setup206_LilyGo_T_Display_S3) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DSMOOTH_FONT=1
    ; --- project ---
    -DDEBUG_LEVEL=3
    -DCORE_DEBUG_LEVEL=0
